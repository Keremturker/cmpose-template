# Checks every pull request, and runs on demand from the Actions tab: detekt, unit tests and builds.
name: CI

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - name: detekt
        run: ./gradlew detekt
      - name: Unit tests (JVM)
        run: ./gradlew testAndroidHostTest
      - name: Android debug build
        run: ./gradlew :androidApp:assembleDebug

  ios:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - name: iOS compile and unit tests (simulator)
        run: ./gradlew :shared:compileKotlinIosSimulatorArm64 iosSimulatorArm64Test
