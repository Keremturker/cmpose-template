# Note: `./gradlew build` also links the RELEASE "Shared" framework for both iOS
# targets, and Kotlin/Native runs that link inside the Gradle daemon. Measured on a
# clean build: 4096M runs out of heap ("Java heap space") at that step, 6144M
# completes it. Day-to-day `:androidApp:assembleDebug` and
# `:shared:compileKotlinIosSimulatorArm64` need far less.

#Kotlin
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx4096M

#Gradle
org.gradle.jvmargs=-Xmx6144M -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
org.gradle.caching=true

#Android
android.nonTransitiveRClass=true
android.useAndroidX=true